name: Windows build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore DeskNest.sln

      - name: Build
        run: dotnet build DeskNest.sln -c Release --no-restore

      - name: Publish x64
        run: dotnet publish src/DeskNest/DeskNest.csproj -c Release -r win-x64 --self-contained false -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o artifacts/DeskNest-win-x64

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: DeskNest-win-x64
          path: artifacts/DeskNest-win-x64/
          if-no-files-found: error
